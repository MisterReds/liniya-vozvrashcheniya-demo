name: Windows x64 playable build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with vcpkg SDL3
        shell: pwsh
        run: >-
          cmake -S engine -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_MANIFEST_MODE=ON
          -DVCPKG_MANIFEST_DIR="$env:GITHUB_WORKSPACE/engine"
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Smoke launch
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter return_line_engine.exe | Select-Object -First 1
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_RENDER_DRIVER = 'software'
          & $exe.FullName --smoke-frame
          if ($LASTEXITCODE -ne 0) { throw 'Windows smoke launch failed.' }
      - name: Package Windows runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter return_line_engine.exe | Select-Object -First 1
          if (-not $exe) { throw 'Windows executable was not produced.' }
          $stage = 'package/ReturnLine-Windows-x64'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $exe.FullName $stage
          $dll = Join-Path $exe.DirectoryName 'SDL3.dll'
          if (-not (Test-Path $dll)) { throw "SDL3.dll was not beside the executable: $dll" }
          Copy-Item $dll $stage
          Copy-Item engine/README.md $stage/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ReturnLine-Windows-x64
          path: package/ReturnLine-Windows-x64/*
          if-no-files-found: error
          retention-days: 30
